name: Preview Capibara V4.3 Refine

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/preview-capibara-v4.yml"
      - "capibara-alpha-source/create_capybara_v4_clean_surface.py"
      - "capibara-alpha-source/apply_v4_1_capybara_identity.py"
      - "capibara-alpha-source/apply_v4_2_target_proportions_fur.py"
      - "capibara-alpha-source/apply_v4_3_face_body_fur_refine.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capibara-alpha-godot

      - name: Prepare and validate V4.3 source
        run: |
          cp capibara-alpha-source/create_capybara_v4_clean_surface.py /tmp/create_capybara_v4.py
          python capibara-alpha-source/apply_v4_1_capybara_identity.py /tmp/create_capybara_v4.py
          python capibara-alpha-source/apply_v4_2_target_proportions_fur.py /tmp/create_capybara_v4.py
          python capibara-alpha-source/apply_v4_3_face_body_fur_refine.py /tmp/create_capybara_v4.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/create_capybara_v4.py')
          s = p.read_text(encoding='utf-8')
          old = 'world = scene.world\nworld.use_nodes = True'
          new = 'world = scene.world\nif world is None:\n    world = bpy.data.worlds.new("Capibara World")\n    scene.world = world\nworld.use_nodes = True'
          if old not in s:
              raise RuntimeError('World patch target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile /tmp/create_capybara_v4.py
          mkdir -p preview-output

      - name: Install Blender Portable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxext6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 xvfb
          curl -fL --retry 5 --retry-delay 3 "https://cdn.builder.blender.org/download/daily/archive/blender-4.5.11-stable%2Bv45.4db51e9d1e1e-linux.x86_64-release.tar.xz" -o blender.tar.xz
          mkdir blender-portable
          tar -xf blender.tar.xz -C blender-portable --strip-components=1
          chmod +x blender-portable/blender

      - name: Render V4.3 in Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a blender-portable/blender -b --python /tmp/create_capybara_v4.py -- "$PWD/preview-output"
          test -s preview-output/capibara_v4_clean_surface.blend
          test -s preview-output/capibara_v4_front.png
          test -s preview-output/capibara_v4_profile.png
          test -s preview-output/capibara_v4_three_quarter.png

      - uses: actions/upload-artifact@v4
        with:
          name: Capibara-V4.3-Refine-Real-Blender
          path: preview-output/
          if-no-files-found: error
          retention-days: 14
