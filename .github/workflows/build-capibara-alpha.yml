name: Build Capibara Alpha 0.1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/capibara-alpha-godot
    paths:
      - "capibara-alpha-source/**"
      - ".github/workflows/build-capibara-alpha.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source project
        run: |
          cat capibara-alpha-source/part_*.b64 | base64 --decode > CapibaraAlpha-source.tar.gz
          tar -xzf CapibaraAlpha-source.tar.gz
          test -f CapibaraAlpha/project.godot
          test -f CapibaraAlpha/tools/create_capybara.py

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest"

      - name: Download Blender Portable 4.5 LTS
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            "https://cdn.builder.blender.org/download/daily/archive/blender-4.5.11-stable%2Bv45.4db51e9d1e1e-linux.x86_64-release.tar.xz" \
            -o blender-portable.tar.xz
          mkdir -p blender-portable
          tar -xf blender-portable.tar.xz -C blender-portable --strip-components=1
          chmod +x blender-portable/blender
          blender-portable/blender --version

      - name: Create capybara model, textures and GLB
        run: |
          mkdir -p build-output
          blender-portable/blender -b \
            --python CapibaraAlpha/tools/create_capybara.py \
            -- "$PWD/build-output" "$PWD/CapibaraAlpha"
          test -s CapibaraAlpha/assets/capibara_alpha.glb
          test -s build-output/capibara_alpha_0_1.blend
          test -s build-output/capibara_alpha_preview.png
          test -s CapibaraAlpha/icon.png

      - name: Download Godot 4.7.1 and Android export templates
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" \
            -o godot.zip
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="$(find godot-bin -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT=$PWD/$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz" \
            -o templates.tpz
          rm -rf templates-unpack
          mkdir -p templates-unpack
          unzip -q templates.tpz -d templates-unpack
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d templates-unpack/templates ]; then
            cp -a templates-unpack/templates/. "$TEMPLATE_DIR/"
          else
            cp -a templates-unpack/. "$TEMPLATE_DIR/"
          fi
          test -s "$TEMPLATE_DIR/android_debug.apk"

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Capibara Alpha,C=CL" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Import and validate Godot project
        run: |
          "$GODOT" --headless --editor --path CapibaraAlpha --quit-after 20
          test -d CapibaraAlpha/.godot

      - name: Export Android APK
        run: |
          mkdir -p CapibaraAlpha/output
          "$GODOT" --headless --path CapibaraAlpha \
            --export-debug "Android" \
            CapibaraAlpha/output/Capibara-Alpha-0.1.apk
          test -s CapibaraAlpha/output/Capibara-Alpha-0.1.apk
          unzip -t CapibaraAlpha/output/Capibara-Alpha-0.1.apk

      - name: Package deliverables
        run: |
          cp CapibaraAlpha/output/Capibara-Alpha-0.1.apk build-output/
          cp CapibaraAlpha/assets/capibara_alpha.glb build-output/
          cp CapibaraAlpha/icon.png build-output/capibara_alpha_icon.png
          sha256sum build-output/Capibara-Alpha-0.1.apk > build-output/Capibara-Alpha-0.1.apk.sha256
          (
            cd CapibaraAlpha
            zip -qr ../build-output/Capibara-Alpha-0.1-source.zip . \
              -x "output/*" ".godot/*"
          )
          find build-output -maxdepth 1 -type f -printf "%f  %s bytes\n" | sort

      - name: Upload alpha package
        uses: actions/upload-artifact@v4
        with:
          name: Capibara-Alpha-0.1
          path: build-output/
          if-no-files-found: error
          retention-days: 30
